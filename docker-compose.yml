services:
  postgres:
    image: postgres:17-alpine
    container_name: trampoline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trampoline
      POSTGRES_PASSWORD: trampoline
      POSTGRES_DB: trampoline
    ports:
      - "5432:5432"
    volumes:
      - trampoline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trampoline -d trampoline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trampoline-pgdata:
