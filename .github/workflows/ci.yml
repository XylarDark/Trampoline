name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # The App Router generates route types into .next/types during a build.
      # Without this, tsc reports phantom errors on app/**/page.tsx params.
      # See docs/KNOWN_ERRORS.md.
      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The engine tests are pure. The seed test runs against in-process PGlite,
      # so no Postgres service container is needed here.
      - name: Test
        run: npm test

      - name: Contrast check
        run: npm run check:contrast

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Advisory. A new upstream advisory should not block an unrelated PR,
      # but it should be visible in the run.
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
